[package]
authors = ["Mike Lodder <redmike7@gmail.com>"]
categories = ["cryptography"]
description = "Wrapper around a secret that is stored in memory with the goal to protect against side-channel and speculative attacks."
documentation = "https://docs.rs/soteria-rs"
edition = "2024"
rust-version = "1.87"
homepage = "https://github.com/mikelodder7/soteria-rs"
keywords = ["cryptography", "memory", "protection", "secure"]
license = "MIT OR Apache-2.0"
name = "soteria-rs"
readme = "README.md"
repository = "https://github.com/mikelodder7/soteria-rs"
version = "0.6.0"

[features]
default = ["kernel-keyring"]
kernel-keyring = []
bls = ["blsful"]
crypto-bigint = ["dep:crypto-bigint"]
ed25519 = ["ed25519-dalek"]
elements = ["dep:group"]
hybrid-array = ["dep:hybrid-array"]
secret-key = ["elliptic-curve"]
serde = ["dep:serde", "postcard"]
signing = ["ecdsa", "elliptic-curve"]
x25519 = ["x25519-dalek"]

[dependencies]
blsful = { version = "4.2", optional = true }
chacha20poly1305 = "0.11"
crypto-bigint = { version = "0.7", features = ["hybrid-array"], optional = true }
ed25519-dalek = { version = "3", optional = true }
elliptic-curve = { version = "0.14", optional = true }
ecdsa = { version = "0.17", features = ["algorithm"], optional = true }
group = { version = "0.14", optional = true }
hybrid-array = { version = "0.4", optional = true }
getrandom = "0.4"
merlin = "3"
serde = { version = "1", optional = true }
postcard = { version = "1", optional = true, features = ["use-std"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"], optional = true }
zeroize = "1"
thiserror = "2"

[dev-dependencies]
k256 = { version = "0.14", features = ["ecdsa"] }
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
serde = { version = "1", features = ["derive"] }
serde_cbor_2 = "0.13"
serde_json = "1"
toml = "1"
yaml_serde = "0.10"
